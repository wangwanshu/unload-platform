<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>无人车卸货履约平台 · 深化版</title>
<link rel="stylesheet" href="https://miaoda.feishu.cn/fonts/css2?family=Noto+Sans+SC:wght@300;400;500;700;900&family=JetBrains+Mono:wght@400;500;700&display=swap">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/leaflet@1.9.4/dist/leaflet.css">
<script src="https://cdn.jsdelivr.net/npm/leaflet@1.9.4/dist/leaflet.js"></script>
<style>
/* ============================================================
   无人车卸货履约平台 —— 深化版
   A 调度舱（深色 · 平台运营视角）
   B 企业工作台（浅色 · 货主视角）
   C 履约现场（高对比 · 一线责任人视角）
   ============================================================ */
*{margin:0;padding:0;box-sizing:border-box}
html,body{height:100%}
body{font-family:'Noto Sans SC','PingFang SC','Microsoft YaHei',system-ui,sans-serif;background:#0B1220;color:#E6EDF7;-webkit-font-smoothing:antialiased}
button{font-family:inherit;cursor:pointer;border:none;background:none;color:inherit}
.mono{font-family:'JetBrains Mono','SFMono-Regular',Consolas,'Courier New',monospace}
a{color:inherit;text-decoration:none}

/* ---------- 顶部版本切换器 ---------- */
.shell{display:flex;flex-direction:column;height:100vh;min-width:1180px;overflow:hidden}
.switcher{display:flex;align-items:center;gap:18px;padding:11px 22px;background:#0D1424;border-bottom:1px solid #1F2A44;flex:0 0 auto;z-index:30}
.switcher__brand{display:flex;align-items:center;gap:12px}
.switcher__logo{width:38px;height:38px;border-radius:10px;display:grid;place-items:center;background:linear-gradient(135deg,#17B8A6,#0E7C6E);color:#fff;flex:0 0 auto}
.switcher__title{font-size:16px;font-weight:800;letter-spacing:.4px}
.switcher__sub{font-size:11px;color:#8CA3C3;margin-top:2px;letter-spacing:.3px}
.switcher__tabs{display:flex;gap:8px;margin-left:12px;flex:1 1 auto}
.switcher__tab{padding:9px 16px;border-radius:9px;font-size:13px;font-weight:600;color:#8CA3C3;border:1px solid transparent;transition:.18s;display:flex;align-items:center;gap:7px}
.switcher__tab .sw-dot{width:7px;height:7px;border-radius:50%;background:currentColor;opacity:.7}
.switcher__tab:hover{color:#D6E2F5;background:#16203A}
.switcher__tab.is-active{color:#0B1220;background:#2DD4BF;border-color:#2DD4BF}
.switcher__hint{font-size:12px;color:#6E84A8;max-width:340px;line-height:1.5;text-align:right}

/* ---------- 版本主体 ---------- */
.ver{display:none;flex:1 1 auto;min-height:0}
.ver.is-active{display:flex;flex-direction:column}
.badge{display:inline-flex;align-items:center;gap:5px;padding:3px 9px;border-radius:999px;font-size:11px;font-weight:600;line-height:1}
.chip{display:inline-flex;align-items:center;gap:4px;padding:2px 7px;border-radius:6px;font-size:10px;font-weight:700;letter-spacing:.2px}

/* ============================================================
   版本 A —— 调度舱
   ============================================================ */
.ver-a{background:radial-gradient(1200px 600px at 15% -10%,rgba(45,212,191,.08),transparent 60%),radial-gradient(900px 500px at 90% 0%,rgba(56,120,255,.07),transparent 55%),#0B1220}
.va-top{display:flex;align-items:center;gap:16px;padding:14px 24px;border-bottom:1px solid #1B2640;flex:0 0 auto}
.va-top h1{font-size:18px;font-weight:800;letter-spacing:.3px}
.va-top .va-date{font-size:12px;color:#8CA3C3;margin-top:3px}
.va-vehicle{display:flex;align-items:center;gap:10px;margin-left:14px;padding:7px 13px;border-radius:10px;background:#0F1930;border:1px solid #1E2B48}
.va-vehicle .vv-cell{text-align:center;padding:0 8px}
.va-vehicle .vv-cell + .vv-cell{border-left:1px solid #1E2B48}
.va-vehicle .vv-k{font-size:10px;color:#6E84A8;letter-spacing:.4px}
.va-vehicle .vv-v{font-size:13px;font-weight:800;color:#C7D5EC;margin-top:1px}
.va-vehicle .vv-v.good{color:#2DD4BF}
.va-vehicle .vv-v.warn{color:#F5A623}
.va-countdown{display:flex;align-items:center;gap:8px;margin-left:auto;padding:8px 14px;border-radius:10px;background:rgba(245,165,35,.08);border:1px solid rgba(245,165,35,.35)}
.va-countdown .cd-k{font-size:11px;color:#F5A623}
.va-countdown .cd-v{font-size:15px;font-weight:900;color:#F5A623}
.va-tabs{display:flex;gap:6px}
.va-tab{padding:8px 14px;border-radius:8px;font-size:13px;font-weight:600;color:#8CA3C3;border:1px solid transparent}
.va-tab:hover{color:#D6E2F5;background:#141F38}
.va-tab.is-active{color:#2DD4BF;border-color:#2DD4BF;background:rgba(45,212,191,.08)}
.va-window{padding:7px 12px;border-radius:8px;text-align:center;font-size:11px;font-weight:700;border:1px solid #2A3A5C;color:#B9C8E0;background:#111A2E}
.va-window b{display:block;font-size:15px;color:#2DD4BF;margin-bottom:1px}

.va-body{flex:1 1 auto;display:grid;grid-template-columns:minmax(0,1.55fr) minmax(330px,1fr);min-height:0}
.va-track{overflow-y:auto;padding:18px 24px;border-right:1px solid #1B2640;min-height:0}
.va-track h2{font-size:13px;font-weight:700;color:#8CA3C3;letter-spacing:1px;margin:2px 0 12px;display:flex;align-items:center;gap:8px}
.va-track h2 .mono{color:#2DD4BF}
.va-rail{position:relative;display:flex;gap:13px;padding:8px 0 16px}
.va-rail::before{content:"";position:absolute;top:34px;left:34px;right:34px;height:2px;background:linear-gradient(90deg,#1F2A44,#24406b);border-radius:2px}
.va-stop{position:relative;flex:1 1 0;min-width:158px;cursor:pointer;border-radius:12px;padding:13px 13px 11px;background:#101A2E;border:1px solid #1E2B48;transition:.18s}
.va-stop:hover{border-color:#2A3A5C;transform:translateY(-2px)}
.va-stop.is-sel{border-color:#2DD4BF;box-shadow:0 0 0 1px #2DD4BF,0 10px 30px -12px rgba(45,212,191,.35)}
.va-stop .vs-head{display:flex;align-items:center;gap:8px;margin-bottom:9px}
.va-stop .vs-eta{font-size:17px;font-weight:800;color:#2DD4BF}
.va-stop .vs-seq{width:22px;height:22px;border-radius:50%;display:grid;place-items:center;font-size:11px;font-weight:700;background:#16233E;color:#6E84A8;border:1px solid #2A3A5C}
.va-stop .vs-name{font-weight:700;font-size:14px;margin:2px 0 3px}
.va-stop .vs-area{font-size:11px;color:#6E84A8}
.va-stop .vs-load{display:flex;gap:8px;margin-top:9px;font-size:11px;color:#9DB1D0;flex-wrap:wrap}
.va-stop .vs-load span{display:inline-flex;align-items:center;gap:4px}
.va-stop .vs-slots{display:flex;gap:4px;margin-top:8px;flex-wrap:wrap}
.slot-chip{padding:2px 6px;border-radius:5px;font-size:10px;font-weight:800;background:#16233E;border:1px solid #27406B;color:#7FA8E8;font-family:'JetBrains Mono',Consolas,monospace}
.va-stop .vs-person{margin-top:9px;padding-top:8px;border-top:1px dashed #22304F;display:flex;align-items:center;gap:7px;font-size:12px;color:#C7D5EC}
.va-stop .vs-person .pf{width:22px;height:22px;border-radius:50%;display:grid;place-items:center;background:#16233E;color:#8CA3C3;flex:0 0 auto}
.va-stop .vs-none{color:#6E84A8;font-size:11px;font-style:normal}

.va-manifest{margin-top:6px;background:#0F1930;border:1px solid #1E2B48;border-radius:12px;padding:14px 16px}
.va-manifest h4{font-size:12px;color:#8CA3C3;letter-spacing:.6px;margin-bottom:11px;display:flex;align-items:center;gap:7px}
.va-manifest .vm-grid{display:grid;grid-template-columns:repeat(12,1fr);gap:6px}
.vm-cell{aspect-ratio:1.5;border-radius:6px;background:#131F38;border:1px solid #22304F;display:flex;flex-direction:column;align-items:center;justify-content:center;font-size:10px;font-weight:800;color:#6E84A8;font-family:'JetBrains Mono',Consolas,monospace}
.vm-cell.has{border-color:#1F6B5A;background:rgba(23,184,166,.12);color:#2DD4BF}
.vm-cell.has.free{border-color:#2A3A5C;background:#131F38;color:#5A6E8E}

.va-side{display:flex;flex-direction:column;min-height:0}
.va-detail{padding:18px 22px;border-bottom:1px solid #1B2640;flex:1 1 auto;overflow-y:auto}
.va-detail h3{font-size:15px;font-weight:800;margin-bottom:4px;display:flex;align-items:center;gap:9px}
.va-detail .vd-sub{font-size:12px;color:#8CA3C3;margin-bottom:15px}
.vd-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:14px}
.vd-cell{background:#0F1930;border:1px solid #1E2B48;border-radius:11px;padding:12px}
.vd-cell .vc-label{font-size:11px;color:#6E84A8;letter-spacing:.4px;margin-bottom:6px;display:flex;align-items:center;gap:6px}
.vd-cell .vc-main{font-weight:700;font-size:14px}
.vd-cell .vc-sub{font-size:11px;color:#8CA3C3;margin-top:3px}
.vd-actions{display:flex;gap:10px;margin-top:6px;flex-wrap:wrap}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:7px;padding:9px 15px;border-radius:9px;font-size:13px;font-weight:700;transition:.16s;line-height:1}
.btn-primary{background:#2DD4BF;color:#07251F}
.btn-primary:hover{background:#3EE0CC}
.btn-ghost{background:#141F38;color:#B9C8E0;border:1px solid #2A3A5C}
.btn-ghost:hover{border-color:#3E5A8C;color:#fff}
.btn-danger{background:rgba(244,114,114,.14);color:#F87171;border:1px solid rgba(244,114,114,.3)}
.btn-danger:hover{background:rgba(244,114,114,.22)}
.btn:disabled{opacity:.45;cursor:not-allowed}
.vd-log{border-top:1px dashed #1E2B48;margin-top:13px;padding-top:12px}
.vd-log .lg-title{font-size:11px;color:#6E84A8;letter-spacing:.5px;margin-bottom:8px;display:flex;align-items:center;gap:6px}
.lg-row{display:flex;gap:9px;font-size:11px;color:#9DB1D0;padding:4px 0}
.lg-row .lg-time{color:#5A6E8E;flex:0 0 auto;font-family:'JetBrains Mono',Consolas,monospace}
.lg-row .lg-act{color:#C7D5EC}
.issue-banner{display:flex;gap:9px;align-items:flex-start;background:rgba(244,114,114,.09);border:1px solid rgba(244,114,114,.35);border-radius:9px;padding:9px 11px;font-size:12px;color:#FBB5B5;margin-bottom:12px}
.issue-banner b{color:#F87171}
.person-card{display:flex;align-items:center;gap:10px;background:#0F1930;border:1px solid #1E2B48;border-radius:10px;padding:10px 12px;margin-bottom:8px}
.person-card .pc-role{font-size:10px;font-weight:800;padding:2px 8px;border-radius:6px;background:#16233E;color:#7FA8E8;flex:0 0 auto}
.person-card .pc-role.main{background:rgba(45,212,191,.15);color:#2DD4BF}
.person-card .pc-name{font-weight:700;font-size:13px}
.person-card .pc-meta{font-size:11px;color:#8CA3C3;margin-top:1px}
.person-card .pc-right{margin-left:auto;text-align:right}
.person-card .pc-right .pc-score{font-size:12px;font-weight:800;color:#F5A623}
.person-card .pc-right .pc-state{font-size:10px;color:#2DD4BF}

.va-summary{padding:14px 22px;background:#0D1526;border-top:1px solid #1B2640;flex:0 0 auto;max-height:42%;overflow-y:auto}
.va-summary .vs-row{display:flex;align-items:center;gap:12px;margin-bottom:9px}
.va-summary .vs-label{font-size:12px;color:#8CA3C3;flex:0 0 auto}
.va-bar{flex:1 1 auto;height:8px;background:#141F38;border-radius:99px;overflow:hidden}
.va-bar i{display:block;height:100%;border-radius:99px;background:linear-gradient(90deg,#17B8A6,#2DD4BF);transition:.4s}
.va-summary .vs-num{font-size:13px;font-weight:800;color:#2DD4BF}
.va-metrics{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin:10px 0 12px}
.va-metric{background:#0F1930;border:1px solid #1E2B48;border-radius:9px;padding:9px 11px}
.va-metric .vm-k{font-size:10px;color:#6E84A8;letter-spacing:.4px}
.va-metric .vm-v{font-size:15px;font-weight:900;color:#C7D5EC;margin-top:2px}
.va-metric .vm-v.good{color:#2DD4BF}
.va-metric .vm-v.warn{color:#F5A623}
.va-alerts{display:flex;flex-direction:column;gap:7px;margin-top:6px}
.va-alert{display:flex;align-items:center;gap:10px;font-size:12px;padding:8px 12px;border-radius:9px;background:#0F1930;border:1px solid #1E2B48}
.va-alert.warn{border-color:rgba(245,165,35,.4);background:rgba(245,165,35,.07)}
.va-alert.bad{border-color:rgba(244,114,114,.4);background:rgba(244,114,114,.07)}
.va-alert .al-dot{width:8px;height:8px;border-radius:50%;flex:0 0 auto}
.va-alert .al-msg{color:#C7D5EC}
.va-alert .al-tag{margin-left:auto;font-size:11px;color:#8CA3C3}

/* ============================================================
   版本 B —— 企业工作台
   ============================================================ */
.ver-b{background:#F4F5F1}
.vb-layout{display:flex;flex:1 1 auto;min-height:0}
.vb-nav{width:220px;background:#FFFFFF;border-right:1px solid #E5E7E0;padding:18px 12px;display:flex;flex-direction:column;flex:0 0 auto}
.vb-brand{display:flex;align-items:center;gap:10px;padding:4px 8px 18px;border-bottom:1px solid #EDEFE9;margin-bottom:12px}
.vb-brand .vb-logo{width:34px;height:34px;border-radius:9px;background:#1F6B4F;color:#fff;display:grid;place-items:center}
.vb-brand b{font-size:14px;font-weight:800;color:#1A2B25}
.vb-brand span{display:block;font-size:11px;color:#7A8A82;margin-top:1px}
.vb-navitem{display:flex;align-items:center;gap:10px;padding:11px 12px;border-radius:9px;font-size:13px;font-weight:600;color:#4A5A52;margin-bottom:2px;transition:.15s;text-align:left}
.vb-navitem:hover{background:#F0F3EC}
.vb-navitem.is-active{background:#E5EFE7;color:#1F6B4F}
.vb-navitem .ni-badge{margin-left:auto;font-size:11px;background:#1F6B4F;color:#fff;padding:1px 7px;border-radius:99px;font-weight:700}
.vb-navitem .ni-badge.warn{background:#C98A2D}
.vb-nav .vb-foot{margin-top:auto;font-size:11px;color:#9AA79F;padding:10px 12px;line-height:1.6}
.vb-main{flex:1 1 auto;min-width:0;overflow-y:auto;padding:22px 26px}
.vb-head{display:flex;align-items:flex-start;gap:16px;margin-bottom:18px}
.vb-head h1{font-size:20px;font-weight:900;color:#1A2B25;letter-spacing:.2px}
.vb-head p{font-size:12px;color:#7A8A82;margin-top:4px}
.vb-head .vb-date{margin-left:auto;font-size:12px;color:#7A8A82;background:#fff;border:1px solid #E5E7E0;padding:7px 12px;border-radius:8px;display:flex;align-items:center;gap:6px}
.vb-kpis{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin-bottom:18px}
.vb-kpi{background:#fff;border:1px solid #E5E7E0;border-radius:13px;padding:15px 16px}
.vb-kpi .k-label{font-size:12px;color:#7A8A82;display:flex;align-items:center;gap:6px}
.vb-kpi .k-num{font-size:26px;font-weight:900;color:#1A2B25;margin-top:8px;letter-spacing:.3px}
.vb-kpi .k-sub{font-size:11px;color:#9AA79F;margin-top:5px}
.vb-kpi .k-num.good{color:#1F6B4F}
.vb-kpi .k-num.warn{color:#B06E15}
.vb-kpi .k-num.bad{color:#C2453D}
.vb-filter{display:flex;gap:8px;margin-bottom:14px;flex-wrap:wrap;align-items:center}
.vb-fgroup{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.vb-fbtn{padding:8px 14px;border-radius:8px;font-size:12px;font-weight:600;color:#4A5A52;background:#fff;border:1px solid #E5E7E0;transition:.15s}
.vb-fbtn:hover{border-color:#C6CDBF}
.vb-fbtn.is-active{background:#1F6B4F;color:#fff;border-color:#1F6B4F}
.vb-table{background:#fff;border:1px solid #E5E7E0;border-radius:13px;overflow:hidden}
.vb-table table{width:100%;border-collapse:collapse;font-size:13px}
.vb-table th{text-align:left;font-size:11px;color:#7A8A82;font-weight:600;padding:11px 14px;background:#FAFBF7;border-bottom:1px solid #EDEFE9;letter-spacing:.4px}
.vb-table td{padding:12px 14px;border-bottom:1px solid #F1F3EC;color:#2B3D35;vertical-align:middle}
.vb-table tr:last-child td{border-bottom:none}
.vb-table tr.clickable{cursor:pointer}
.vb-table tr.clickable:hover td{background:#F6F8F3}
.vb-table .t-strong{font-weight:700;color:#1A2B25}
.vb-table .t-muted{font-size:11px;color:#9AA79F}
.status-pill{display:inline-flex;align-items:center;gap:6px;font-size:11px;font-weight:700;padding:4px 10px;border-radius:999px}
.status-pill .sp-dot{width:6px;height:6px;border-radius:50%}
.st-ready{background:#E3F1E6;color:#1F6B4F}
.st-ready .sp-dot{background:#2F9E6E}
.st-partial,.st-escalated{background:#FBF0DC;color:#9A6A12}
.st-partial .sp-dot,.st-escalated .sp-dot{background:#D9922E}
.st-broadcast{background:#FBE4E1;color:#B23A32}
.st-broadcast .sp-dot{background:#D24B42}
.st-done{background:#E4ECF3;color:#3D6487}
.st-done .sp-dot{background:#5A87B0}
.vb-empty{padding:34px;text-align:center;color:#9AA79F;font-size:13px}
.slot-chip.light{background:#F0F3EC;border:1px solid #D8DED2;color:#4A5A52}

/* 抽屉 */
.vb-drawer{position:fixed;top:0;right:0;bottom:0;width:440px;background:#fff;border-left:1px solid #E5E7E0;box-shadow:-18px 0 40px -20px rgba(26,43,37,.25);transform:translateX(105%);transition:transform .28s;z-index:40;display:flex;flex-direction:column}
.vb-drawer.open{transform:translateX(0)}
.vd-head{padding:18px 20px;border-bottom:1px solid #EDEFE9;display:flex;align-items:flex-start;gap:12px}
.vd-head h3{font-size:16px;font-weight:800;color:#1A2B25}
.vd-head p{font-size:12px;color:#7A8A82;margin-top:3px}
.vd-close{margin-left:auto;width:30px;height:30px;border-radius:8px;display:grid;place-items:center;color:#7A8A82}
.vd-close:hover{background:#F0F3EC}
.vd-body{padding:18px 20px;overflow-y:auto;flex:1 1 auto}
.vd-sec{margin-bottom:17px}
.vd-sec .vs-title{font-size:11px;font-weight:700;color:#9AA79F;letter-spacing:.6px;margin-bottom:9px;display:flex;align-items:center;gap:6px}
.bind-row{display:flex;align-items:center;gap:11px;padding:11px 13px;border:1px solid #EDEFE9;border-radius:11px;margin-bottom:8px;background:#FAFBF7}
.bind-row .br-role{font-size:10px;font-weight:700;padding:2px 8px;border-radius:6px;background:#EDF0EA;color:#5C6B63;flex:0 0 auto}
.bind-row .br-role.main{background:#1F6B4F;color:#fff}
.bind-row .br-name{font-weight:700;font-size:13px;color:#1A2B25}
.bind-row .br-sub{font-size:11px;color:#7A8A82;margin-top:1px}
.bind-row .br-state{margin-left:auto;font-size:11px;font-weight:700;text-align:right}
.bind-row .br-state.ok{color:#1F6B4F}
.bind-row .br-state.no{color:#B06E15}
.bind-row .br-state .br-phone{display:block;font-size:10px;color:#9AA79F;font-weight:500;margin-top:2px}
.bind-empty{padding:14px;text-align:center;color:#9AA79F;font-size:12px;border:1px dashed #D8DED2;border-radius:11px}
.vd-actions{display:flex;flex-direction:column;gap:9px}
.vb-btn{display:flex;align-items:center;justify-content:center;gap:8px;padding:11px 16px;border-radius:10px;font-size:13px;font-weight:700;transition:.15s}
.vb-btn.primary{background:#1F6B4F;color:#fff}
.vb-btn.primary:hover{background:#185A41}
.vb-btn.soft{background:#E5EFE7;color:#1F6B4F}
.vb-btn.soft:hover{background:#DBE9DD}
.vb-btn.warn-soft{background:#FBF0DC;color:#9A6A12}
.vb-btn.warn-soft:hover{background:#F7E6C2}
.vb-btn.danger-soft{background:#FBE4E1;color:#B23A32}
.vb-btn.danger-soft:hover{background:#F7D6D1}
.vb-btn:disabled{opacity:.5;cursor:not-allowed}
.vd-log{border-top:1px dashed #EDEFE9;padding-top:11px}
.lg-row.light{color:#5C6B63}
.lg-row.light .lg-time{color:#9AA79F}
.lg-row.light .lg-act{color:#4A5A52}

/* 表单（新建任务） */
.vb-form{background:#fff;border:1px solid #E5E7E0;border-radius:13px;padding:22px;max-width:720px}
.vb-form .f-row{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-bottom:15px}
.vb-form .f-field{display:flex;flex-direction:column;gap:6px}

.vm-stop .vs-main b{font-size:13px;color:#E6EDF7;display:block}
.vm-stop .vs-main .t-muted{font-size:11px;color:#6E84A8;margin-top:2px}
.vm-stop .vs-ops{flex:0 0 auto}
.vm-empty-td{text-align:center;color:#6E84A8;padding:26px!important}
.vm-route-meta{display:flex;gap:16px;padding:10px 18px;font-size:11px;color:#8CA3C3;border-bottom:1px solid #16233E;flex-wrap:wrap}
/* 弹窗 */
.vm-modal{position:fixed;inset:0;z-index:120;display:none;align-items:center;justify-content:center;padding:18px;background:rgba(4,8,16,.66);backdrop-filter:blur(4px)}
.vm-modal.open{display:flex}
.vm-modal-box{width:min(460px,100%);max-height:88vh;display:flex;flex-direction:column;background:#0F1930;border:1px solid #2A3A5C;border-radius:15px;box-shadow:0 26px 70px -18px rgba(0,0,0,.7);overflow:hidden}
.vm-modal-head{display:flex;align-items:center;padding:14px 18px;border-bottom:1px solid #1B2640;flex:0 0 auto}
.vm-modal-head b{font-size:15px;font-weight:800;color:#E6EDF7}
.vm-modal-x{margin-left:auto;color:#6E84A8;font-size:15px;padding:4px;display:grid;place-items:center}
.vm-modal-x:hover{color:#F87171}
.vm-modal-body{padding:16px 18px;overflow-y:auto}
.vm-form{display:flex;flex-direction:column;gap:11px}
.vm-frow{display:flex;flex-direction:column;gap:6px}
.vm-frow label{font-size:12px;color:#8CA3C3;font-weight:600}
.vm-frow input,.vm-frow select,.vm-frow textarea{width:100%;padding:10px 12px;border-radius:9px;background:#0C1424;border:1px solid #22304F;color:#E6EDF7;font-size:13px;font-family:inherit;outline:none}
.vm-frow input:focus,.vm-frow select:focus,.vm-frow textarea:focus{border-color:#2DD4BF}
.vm-frow input[readonly]{opacity:.6}
.vm-frow select option{background:#0F1930}
.vm-form-foot{display:flex;gap:10px;justify-content:flex-end;margin-top:6px}
.vm-confirm p{font-size:14px;color:#C7D5EC;line-height:1.7;margin-bottom:16px}
/* 地图 */
.vm-map-wrap{position:relative;height:100%;min-height:420px}
.vm-map{position:absolute;inset:0;border-radius:13px;border:1px solid #1E2B48;z-index:1;background:#0C1424}
.vm-timebar{display:flex;align-items:center;gap:10px;padding:9px 14px;margin:0 0 10px;background:rgba(13,27,42,.72);border-radius:12px;flex-wrap:wrap}
.tb-ic{color:#7DD3FC;display:flex}
.tb-ic svg{width:15px;height:15px}
.tb-label{color:#E5EFFB;font-size:12px;font-weight:600}
.vm-timebar input[type=range]{flex:1 1 160px;min-width:120px;accent-color:#2DD4BF;height:4px;cursor:pointer}
.tb-val{color:#2DD4BF;font-size:13px;font-family:ui-monospace,Consolas,monospace;min-width:44px;text-align:center}
.tb-live{background:rgba(45,212,191,.16);border:1px solid rgba(45,212,191,.5);color:#7DF0E4;font-size:12px;font-weight:700;padding:5px 10px;border-radius:8px;cursor:pointer;display:flex;align-items:center;gap:5px;white-space:nowrap}
.tb-live svg{width:12px;height:12px}
.ma-arrow-ic{pointer-events:none}
.vm-map .mp-card{font-family:'PingFang SC','Microsoft YaHei',sans-serif;min-width:190px;max-width:230px;font-size:12px;color:#C7D5EC;line-height:1.55}
.vm-map .mp-card .mp-title{font-size:14px;font-weight:800;color:#F2F7FF;margin-bottom:2px}
.vm-map .mp-card .mp-line{font-size:11px;color:#8FA6C8;margin-bottom:8px;display:flex;align-items:center;gap:4px}
.vm-map .mp-card .mp-line svg{width:12px;height:12px}
.vm-map .mp-card .mp-grid{display:grid;grid-template-columns:1fr 1fr;gap:5px 10px;margin-bottom:8px}
.vm-map .mp-card .mp-grid div{background:rgba(11,18,32,.5);border-radius:7px;padding:5px 7px}
.vm-map .mp-card .mp-grid span{display:block;font-size:10px;color:#7E93B3}
.vm-map .mp-card .mp-grid b{font-size:12px;color:#F2F7FF}
.vm-map .mp-card .mp-row{display:flex;justify-content:space-between;gap:8px;padding:2.5px 0;border-top:1px dashed rgba(90,120,170,.22)}
.vm-map .mp-card .mp-row span{color:#7E93B3;font-size:11px}
.vm-map .mp-card .mp-row b{font-size:12px;font-weight:700;text-align:right;color:#F2F7FF}
.vm-map .mp-card .mp-note{margin-top:6px;padding:5px 7px;background:rgba(245,166,35,.16);border-radius:7px;font-size:11px;color:#FFD98A}
.vm-map-tip{position:absolute;left:12px;bottom:12px;z-index:500;font-size:11px;color:#8CA3C3;background:rgba(11,18,32,.9);border:1px solid #22304F;border-radius:8px;padding:6px 10px;max-width:calc(100% - 24px);line-height:1.5}
.vm-map-loading{position:absolute;inset:0;display:grid;place-items:center;align-content:center;gap:10px;color:#8CA3C3;font-size:13px;background:#0C1424}
.vm-map-loading i{width:26px;height:26px;border:3px solid #22304F;border-top-color:#2DD4BF;border-radius:50%;animation:vmSpin 0.9s linear infinite}
@keyframes vmSpin{to{transform:rotate(360deg)}}
.vm-map-loading span{font-size:11px;color:#5A6E8E}
.vm-map-fail{position:absolute;inset:0;display:grid;place-items:center;color:#F5A623;font-size:13px;text-align:center;padding:30px;line-height:1.8}
.vm-map .leaflet-popup-content-wrapper{background:#0F1930;color:#C7D5EC;border:1px solid #2A3A5C;border-radius:10px}
.vm-map .leaflet-popup-tip{background:#0F1930;border:1px solid #2A3A5C}
.vm-map .leaflet-popup-content b{color:#2DD4BF}
.vm-map .leaflet-container{background:#0C1424;font-family:'Noto Sans SC',sans-serif}
.vm-map .leaflet-control-zoom a{background:#0F1930;color:#C7D5EC;border:1px solid #22304F}
.vm-map .leaflet-control-zoom a:hover{background:#16233E;color:#2DD4BF}
.vm-map .leaflet-control-attribution{background:rgba(11,18,32,.7);color:#5A6E8E;font-size:9px}
/* 地图源配置条 */
.vm-map-bar{display:flex;align-items:center;gap:12px;padding:10px 16px;background:#0F1930;border:1px solid #1E2B48;border-radius:11px;margin-bottom:12px;flex-wrap:wrap}
.mb-src{font-size:12px;color:#8CA3C3;display:inline-flex;align-items:center;gap:7px}
.mb-src b{color:#2DD4BF}
.vm-map-bar .vm-btn{margin-left:auto}
/* 高德标记 */
.amap-mk{width:24px;height:24px;border-radius:50% 50% 50% 4px;color:#fff;font-size:11px;font-weight:800;display:grid;place-items:center;border:2px solid #fff;box-shadow:0 2px 8px rgba(0,0,0,.4);transform:rotate(-45deg)}
.amap-mk.dep{background:#8CA3C3;transform:none;border-radius:50%}
/* 车辆实时位置标记 */
.veh-ic{background:transparent;border:none}
.veh-mk{width:30px;height:30px;border-radius:9px 9px 9px 2px;display:grid;place-items:center;font-size:9px;font-weight:900;color:#fff;letter-spacing:.3px;border:2px solid #fff;box-shadow:0 3px 12px rgba(0,0,0,.55);animation:vehPulse 1.8s ease-in-out infinite}
.veh-mk .veh-st{position:absolute;right:-3px;top:-3px;width:10px;height:10px;border-radius:50%;border:2px solid #0B1220;box-shadow:0 0 6px rgba(0,0,0,.6)}
@keyframes vehPulse{0%,100%{box-shadow:0 3px 12px rgba(0,0,0,.55)}50%{box-shadow:0 3px 20px rgba(45,212,191,.85)}}
.amap-inf{font-family:'Noto Sans SC',sans-serif;font-size:12px;color:#334;line-height:1.7}
.amap-inf b{color:#1F6B4F}
.amap-inf span{display:block;color:#667}
.amap-container{background:#0C1424}
.vm-map .amap-logo,.vm-map .amap-copyright{opacity:.6}
/* 坐标点选 */
.vm-coord-row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
/* 线路折叠 */
.vm-route-card .route-head{cursor:pointer}
.route-detail{display:none}
.vm-route-card.is-open .route-detail{display:block}
.vm-route-card.is-open .rt-arrow{transform:rotate(180deg)}
.rt-arrow{transition:transform .2s;color:#6E84A8;vertical-align:-2px;margin-right:2px}
/* 货物标识快捷标签 */
.vm-chiprow{display:flex;gap:6px;flex-wrap:wrap;margin:-4px 0 12px}
.vm-chip{border:1px solid #243350;background:#0F1930;color:#9FB6DA;font-size:11px;padding:4px 10px;border-radius:999px;cursor:pointer;transition:.15s}
.vm-chip:hover{border-color:#2DD4BF;color:#2DD4BF}
/* pick 弹窗：搜索与选点 */
.vm-pick-search{display:flex;gap:8px;margin-bottom:6px}
.vm-pick-results{max-height:110px}
.vm-pick-search input{flex:1;min-width:0;background:#0B1426;border:1px solid #22304F;border-radius:9px;color:#E8F0FB;padding:9px 11px;font-size:13px;outline:none}
.vm-pick-search input:focus{border-color:#2DD4BF}
.vm-pick-results{display:flex;flex-direction:column;gap:6px;max-height:110px;overflow:auto;margin-bottom:6px}
.pk-item{text-align:left;background:#0F1930;border:1px solid #1E2B48;border-radius:9px;padding:7px 10px;color:#C7D5EC;cursor:pointer;font-size:12px}
.pk-item b{display:block;font-size:12px;color:#E8F0FB}
.pk-item:hover{border-color:#2DD4BF}
.pk-loading,.pk-empty{padding:9px;font-size:12px;color:#8FA6C8;background:#0F1930;border:1px dashed #22304F;border-radius:9px}
.pk-keybox{display:flex;align-items:center;gap:8px;padding:9px 11px;background:rgba(245,166,35,.08);border:1px solid rgba(245,166,35,.4);border-radius:10px;font-size:12px;color:#FFD98A;flex-wrap:wrap}
.pk-keybox b{display:flex;align-items:center;gap:6px;font-size:12px;white-space:nowrap}
.pk-keybox b svg{width:14px;height:14px}
.pk-keybox input{flex:1 1 200px;min-width:160px;background:#0B1426;border:1px solid #4A3F2A;border-radius:8px;color:#E8F0FB;padding:7px 10px;font-size:12px;outline:none}
.pk-keybox input:focus{border-color:#F5A623}
.pk-keybox .vm-btn{padding:6px 12px;font-size:12px;white-space:nowrap}
.vm-pick-tip{display:flex;align-items:center;gap:6px;font-size:11px;color:#8FA6C8;margin-bottom:8px;flex-wrap:wrap}
.vm-pick-tip .vm-btn{padding:2px 8px;font-size:11px;margin:0}
.vm-pick-sel{display:none;margin:8px 0 0;padding:7px 10px;background:rgba(45,212,191,.12);border:1px solid rgba(45,212,191,.45);color:#7DF0E4;border-radius:9px;font-size:12px;font-weight:700}
.vm-form-foot #pkOk:disabled{opacity:.4;cursor:not-allowed}
/* 人员管理 · 骑手转化 */
.src-tag{display:inline-block;margin-top:3px;font-size:10px;padding:1px 7px;border-radius:999px;background:rgba(45,212,191,.12);color:#7DF0E4;border:1px solid rgba(45,212,191,.35)}
.src-tag.swap{background:rgba(167,139,250,.14);color:#C9B4FA;border-color:rgba(167,139,250,.4)}
.inv-kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:10px;margin-bottom:10px}
.inv-kpi{background:linear-gradient(135deg,#12203C,#0E1A33);border:1px solid #22304F;border-radius:12px;padding:11px 13px}
.inv-kpi b{display:block;font-size:22px;color:#E8F0FB;line-height:1.2}
.inv-kpi span{font-size:11px;color:#8FA6C8}
.inv-kpi.swap b{color:#C9B4FA}
.inv-kpi.warn b{color:#FFC98A}
.inv-funnel{display:flex;gap:0;margin-bottom:12px;flex-wrap:wrap}
.inv-funnel i{flex:1 1 0;min-width:110px;text-align:center;font-style:normal;font-size:11px;color:#8FA6C8;background:#0C1424;border:1px solid #22304F;padding:7px 6px;position:relative}
.inv-funnel i:not(:first-child){border-left:none}
.inv-funnel i:first-child{border-radius:9px 0 0 9px;color:#7DF0E4}
.inv-funnel i:last-child{border-radius:0 9px 9px 0;color:#FFC98A}
.inv-funnel i::after{content:"›";position:absolute;right:-9px;top:50%;transform:translateY(-50%);color:#3B4D70;font-size:16px;z-index:2}
.inv-funnel i:last-child::after{display:none}
.inv-tabs{display:flex;gap:8px;margin-bottom:12px}
.inv-tabs button{background:#0C1424;border:1px solid #22304F;color:#8FA6C8;border-radius:999px;padding:5px 14px;font-size:12px;cursor:pointer}
.inv-tabs button.on{background:rgba(45,212,191,.14);border-color:rgba(45,212,191,.55);color:#7DF0E4}
.vm-sub{font-size:12px;color:#FFC98A;margin:2px 0 8px;font-weight:700}
.inv-pends{display:flex;flex-direction:column;gap:8px;margin-bottom:14px}
.inv-pend{background:#0F1930;border:1px solid #26385A;border-radius:12px;padding:11px 13px}
.ip-top{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.ip-top b{font-size:14px;color:#E8F0FB}
.ip-grid{display:inline-flex;align-items:center;gap:4px;font-size:11px;color:#C9B4FA;background:rgba(167,139,250,.12);border-radius:999px;padding:2px 9px}
.ip-grid svg{width:11px;height:11px}
.ip-time{margin-left:auto;font-size:11px;color:#5F769A}
.ip-mid{font-size:12px;color:#9FB6DA;margin-top:5px}
.ip-skills{display:flex;gap:6px;flex-wrap:wrap;margin-top:7px}
.ip-skills i{font-style:normal;font-size:11px;color:#9FB6DA;background:#0C1424;border:1px solid #22304F;border-radius:999px;padding:2px 9px}
.ip-ops{display:flex;gap:8px;margin-top:9px;flex-wrap:wrap}
.inv-mdl{display:flex;flex-direction:column;gap:10px}
.inv-qr{display:flex;flex-direction:column;align-items:center;gap:6px;background:#0C1424;border:1px dashed #2A3A5C;border-radius:12px;padding:12px}
.inv-qr img{width:150px;height:150px;background:#fff;border-radius:8px}
.inv-link{display:flex;gap:8px}
.inv-link input{flex:1;min-width:0;background:#0B1426;border:1px solid #22304F;border-radius:9px;color:#9FB6DA;padding:8px 10px;font-size:11px;outline:none}
.inv-words{display:flex;gap:8px}
.inv-words textarea{flex:1;min-width:0;background:#0B1426;border:1px solid #22304F;border-radius:9px;color:#9FB6DA;padding:8px 10px;font-size:11px;line-height:1.6;resize:none;outline:none}

/* 骑手扫码落地页 */
.login__invite{margin-top:10px;background:none;border:1px dashed rgba(45,212,191,.45);color:#7DF0E4;font-size:12px;padding:9px 16px;border-radius:999px;cursor:pointer;transition:.15s;width:100%}
.login__invite:hover{background:rgba(45,212,191,.1)}
.inv-card{position:relative;max-width:430px}
.inv-x{position:absolute;top:14px;right:16px;background:none;border:none;color:#8FA6C8;font-size:20px;line-height:1;cursor:pointer;z-index:2}
.inv-x:hover{color:#E8F0FB}
.iv-tip{font-size:12px;color:#9FB6DA;background:rgba(45,212,191,.08);border:1px solid rgba(45,212,191,.3);border-radius:10px;padding:10px 12px;line-height:1.7;margin:2px 0 14px}
.iv-form{display:flex;flex-direction:column;gap:10px;width:100%}
.iv-row{display:flex;flex-direction:column;gap:5px}
.iv-row label{font-size:12px;color:#8FA6C8}
.iv-row input,.iv-row select{background:#0B1426;border:1px solid #22304F;border-radius:9px;color:#E8F0FB;padding:9px 11px;font-size:13px;outline:none}
.iv-row input:focus,.iv-row select:focus{border-color:#2DD4BF}
.iv-chips{display:flex;gap:7px;flex-wrap:wrap}
.iv-chip{position:relative;cursor:pointer}
.iv-chip input{position:absolute;opacity:0;pointer-events:none}
.iv-chip span{display:inline-block;font-size:12px;color:#9FB6DA;background:#0C1424;border:1px solid #22304F;border-radius:999px;padding:5px 12px;transition:.15s}

.iv-form .login__demo{margin-top:6px}
.iv-ok{display:flex;flex-direction:column;align-items:center;gap:10px;text-align:center;padding:22px 8px}

.iv-ok b{font-size:16px;color:#E8F0FB}
.iv-ok p{font-size:12px;color:#9FB6DA;line-height:1.8;max-width:300px}
.vm-coord-row input{flex:1 1 auto}
.pick-modal .vm-modal-box{width:min(520px,94vw);height:min(600px,86vh)}
.pick-modal .vm-modal-body{display:flex;flex-direction:column;overflow:hidden;padding:12px 14px;flex:1;min-height:0}

.vm-pick-map{height:300px;border-radius:11px;margin:6px 0 10px}
.vm-pick-map.pk-static{height:300px}
.vm-pick-tip{font-size:12px;color:#8CA3C3;background:#0C1424;border:1px dashed #2A3A5C;border-radius:9px;padding:9px 12px;margin-bottom:12px;line-height:1.6}
.vm-cfg-tip{font-size:12px;color:#9DB1D0;line-height:1.8;background:#0C1424;border:1px solid #1E2B48;border-radius:9px;padding:10px 12px}

.vm-cfg-steps{font-size:11px;color:#8CA3C3;line-height:1.8;background:#0C1424;border:1px dashed #2A3A5C;border-radius:9px;padding:10px 12px}

.vm-cfg-opt span{font-size:10.5px;color:#5A6E8E;line-height:1.5}

.vm-cfg-opt.is-sel b{color:#2DD4BF}

.vm-report{display:flex;flex-direction:column;gap:14px}
.rp-kpis{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}
.rp-kpi{background:#0F1930;border:1px solid #1E2B48;border-radius:12px;padding:15px 16px}

.rp-rdot{width:10px;height:10px;border-radius:50%;display:inline-block}
.rp-bars{display:flex;flex-direction:column;gap:8px}
.rp-bar{display:flex;align-items:center;gap:10px;font-size:11px}

.rp-row{display:flex;align-items:center;gap:12px;padding:10px 18px;border-bottom:1px solid #16233E;font-size:12px}
.rp-row:last-child{border-bottom:none}
.rp-rn{width:130px;color:#C7D5EC;flex:0 0 auto}
.rp-rt{flex:1 1 auto;height:9px;background:#141F38;border-radius:99px;overflow:hidden}
.rp-rt i{display:block;height:100%;background:linear-gradient(90deg,#F5A623,#FFC46B);border-radius:99px}
.rp-rt.good i{background:linear-gradient(90deg,#2DD4BF,#3EE0CC)}
.rp-row b{width:70px;text-align:right;color:#E6EDF7;font-family:'JetBrains Mono',Consolas,monospace}

/* ============================================================
   响应式 · 手机 / 平板自适应
   ============================================================ */
@media (max-width:1180px){
  .shell{min-width:0}
  .switcher__hint{display:none}
}
@media (max-width:960px){
  .login{padding:16px}
  .login__card{padding:28px 22px 24px}
  .login__roles{grid-template-columns:1fr;gap:10px}
  .login__role{flex-direction:row;align-items:center;padding:14px 14px}
  .lr-desc{min-height:0;flex:1 1 auto}
  .lr-tags{margin-left:auto;flex:0 0 auto;max-width:46%}
  /* B 版侧栏折叠为顶部横向导航 */
  .vb-layout{flex-direction:column}
  .vb-nav{width:auto;flex-direction:row;overflow-x:auto;padding:10px 12px;border-right:none;border-bottom:1px solid #E5E7E0;align-items:center;gap:4px}
  .vb-brand{padding:0 8px 0 4px;border-bottom:none;margin-bottom:0;border-right:1px solid #EDEFE9;flex:0 0 auto}
  .vb-nav .vb-foot{display:none}
  .vb-navitem{white-space:nowrap;flex:0 0 auto}
  .vb-kpis{grid-template-columns:repeat(2,1fr)}
}
@media (max-width:760px){
  body{font-size:14px}
  /* 顶部 */
  .switcher{padding:9px 12px;gap:10px;flex-wrap:wrap}
  .switcher__brand .switcher__sub{display:none}
  .switcher__tabs{margin-left:0;order:3;width:100%;flex:1 1 100%;justify-content:space-between}
  .switcher__tab{flex:1 1 0;justify-content:center;padding:8px 6px;font-size:12px}
  /* A 版 */
  .va-top{padding:12px 14px;flex-wrap:wrap;gap:10px}
  .va-vehicle{margin-left:0;order:3;width:100%;justify-content:space-around}
  .va-countdown{margin-left:auto}
  .va-body{grid-template-columns:1fr;display:flex;flex-direction:column}
  .va-track{order:1;border-right:none;border-bottom:1px solid #1B2640;padding:14px 14px}
  .va-rail{flex-direction:column;align-items:stretch}
  .va-rail::before{display:none}
  .va-stop{min-width:0}
  .va-side{order:2;flex:1 1 auto;display:flex;flex-direction:column}
  .va-detail{padding:14px 14px}
  .va-summary{max-height:none}
  .va-metrics{grid-template-columns:repeat(2,1fr)}
  .va-manifest .vm-grid{grid-template-columns:repeat(6,1fr)}
  /* B 版 */
  .vb-main{padding:14px 12px}
  .vb-head{flex-direction:column;gap:10px}
  .vb-head .vb-date{margin-left:0;align-self:flex-start}
  .vb-kpis{grid-template-columns:repeat(2,1fr);gap:10px}
  .vb-table{overflow-x:auto}
  .vb-table table{min-width:640px}
  /* C 版 */
  .vc-top{flex-direction:column;align-items:stretch;gap:12px}
  .vc-shift{justify-content:space-around}
  .vc-body{flex-direction:column;display:flex}
  .vc-list{order:2;border-right:none;border-top:1px solid #1D262E;max-height:none}
  .vc-ops{order:1}
  .vo-steps{overflow-x:auto;padding-bottom:4px}
  /* 登录 */
  .login__brand h1{font-size:21px}
  /* M 运营管理 */
  .vm-top{padding:10px 12px}
  .vm-meta{width:100%;margin-left:0;order:3;flex-wrap:wrap}
  .vm-body{padding:12px}
  .vm-table{overflow-x:auto}
  .vm-table table{min-width:560px}
  .vm-stop{flex-wrap:wrap}
  .vm-stop .vs-ops{width:100%;justify-content:flex-end}
  .vm-map-wrap{min-height:340px}
  .vm-map-tip{display:none}
  .rp-kpis{grid-template-columns:repeat(2,1fr);gap:10px}
  .rp-bk{width:70px}
  .rp-bar b{width:60px}
  .rp-rn{width:96px}
  .vm-map-bar .vm-btn{margin-left:0}
}
@media (max-width:520px){
  .login__card{padding:24px 16px 20px}
  .login__role{flex-wrap:wrap}
  .lr-tags{max-width:100%;margin-left:0}
  .lr-desc{flex:1 1 100%;min-height:0}
  .switcher__exit{font-size:11px;padding:7px 10px}
  .va-metrics{grid-template-columns:1fr 1fr}
  .vb-kpis{grid-template-columns:1fr 1fr;gap:8px}
  .vb-kpi .k-num{font-size:20px}
  .va-vehicle .vv-cell{padding:0 5px}
}

.switcher__logo{animation:glowRing 2.6s ease-in-out infinite}
.login__logo{width:78px;height:78px;border-radius:21px;animation:floaty 4s ease-in-out infinite;box-shadow:0 12px 30px -8px rgba(45,212,191,.55)}
.login__card{animation:fadeUp .45s ease}
/* 登录页角色卡图标 */
.login__role{position:relative;overflow:hidden}
.login__role::before{content:"";position:absolute;inset:0;background:radial-gradient(130px 100px at 88% -12%,rgba(45,212,191,.16),transparent 70%);opacity:0;transition:.25s}
.login__role:hover::before{opacity:1}
.lr-ic{width:48px;height:48px;border-radius:14px;font-size:0;display:grid;place-items:center;transition:transform .22s,box-shadow .22s}
.lr-ic svg{width:26px;height:26px;stroke-width:1.5}
.login__role:hover .lr-ic{transform:scale(1.08) rotate(-3deg);box-shadow:0 8px 20px -8px rgba(0,0,0,.5)}
.lr-tags i{transition:.15s}
.login__role:hover .lr-tags i{border-color:#2DD4BF;color:#2DD4BF;background:rgba(45,212,191,.08)}
/* 顶栏 */
.switcher{background:linear-gradient(90deg,#0C1322,#101B33)}
.switcher__tab .sw-dot{width:8px;height:8px;transition:.18s}
.switcher__tab .sw-ic{display:grid;place-items:center;transition:transform .18s}
.switcher__tab .sw-ic svg{width:15px;height:15px}
.switcher__tab:hover .sw-ic{transform:scale(1.15)}
.switcher__tab.is-active .sw-ic{color:#07251F}
.switcher__tab.is-active{box-shadow:0 6px 18px -8px rgba(45,212,191,.65)}
.switcher__brand:hover .switcher__logo{transform:rotate(4deg)}
.switcher__logo{transition:transform .25s}
/* 版本条 */
.ver-banner .bn-tag{display:inline-flex;align-items:center;gap:5px}
.bn-tag svg{width:12px;height:12px;stroke-width:1.8}
/* 图标悬停动效 */
.vm-nav svg,.vm-btn svg,.btn svg,.vc-bigbtn svg,.vg-btn svg,.vb-btn svg,.bill svg,.vm-cfg-opt svg,.f-submit svg,.an-btn svg{transition:transform .18s}
.vm-nav:hover svg,.vm-btn:hover svg,.btn:hover svg,.vc-bigbtn:hover svg,.vg-btn:hover svg,.vb-btn:hover svg,.bill:hover svg,.vm-cfg-opt:hover svg,.f-submit:hover svg,.an-btn:hover svg{transform:scale(1.18)}
/* 卡片质感 */
.vm-card,.va-stop,.vc-task,.vd-cell,.person-card,.vo-panel,.vb-kpi,.vb-kpi,.bind-row,.va-alert{transition:transform .18s,box-shadow .18s,border-color .18s}
.vm-card:hover,.vo-panel:hover,.vb-kpi:hover,.bind-row:hover{transform:translateY(-2px);box-shadow:0 14px 30px -16px rgba(0,0,0,.6)}
.va-stop:hover,.vc-task:hover,.vd-cell:hover,.person-card:hover{box-shadow:0 12px 26px -14px rgba(0,0,0,.6)}
/* 状态徽标质感 */
.status-pill{display:inline-flex;align-items:center;gap:5px}
.sp-dot{box-shadow:0 0 0 3px rgba(255,255,255,.28)}
/* 统计数字高亮 */
.rp-kpi,.sh-cell,.vc-shift .sh-cell{position:relative;overflow:hidden}
.rp-kpi::after,.sh-cell::after{content:"";position:absolute;top:-40%;right:-40%;width:70%;height:120%;background:radial-gradient(circle,rgba(45,212,191,.12),transparent 65%);pointer-events:none}
/* B 版 KPI 卡片直达 */
.vb-kpi.vb-go{cursor:pointer;position:relative}
.vb-kpi.vb-go::after{content:"直达";position:absolute;top:10px;right:12px;font-size:9px;font-weight:800;padding:2px 6px;border-radius:6px;background:rgba(31,107,79,.12);color:#1F6B4F;letter-spacing:.4px;transition:.15s}
.vb-kpi.vb-go:hover::after{background:#1F6B4F;color:#fff}
.vb-kpi.vb-go .k-sub{color:#1F6B4F}
/* 班次类型选择（B 版新建任务） */
.f-shift-wrap{margin-bottom:16px;padding:14px;border:1px solid rgba(31,107,79,.22);border-radius:14px;background:rgba(31,107,79,.05)}
.fs-title{font-size:13px;font-weight:800;color:#1F4D3A;margin-bottom:10px;display:flex;align-items:center;gap:7px}
.fs-title svg{width:15px;height:15px}
.f-shift{display:flex;gap:10px;flex-wrap:wrap}
.fs-opt{flex:1 1 200px;display:flex;flex-direction:column;gap:3px;padding:12px 14px;border-radius:11px;border:1px solid rgba(31,107,79,.25);background:rgba(31,107,79,.04);cursor:pointer;transition:.15s;box-sizing:border-box}
.fs-opt input{display:none}
.fs-opt b{font-size:13px;color:#1F4D3A;display:flex;align-items:center;gap:6px}
.fs-opt b::before{content:"";width:10px;height:10px;border-radius:50%;border:2px solid rgba(31,107,79,.4);box-sizing:border-box;flex:0 0 auto}
.fs-opt span{font-size:11px;color:#5C6B63;line-height:1.5}
.fs-opt.is-on{border-color:#1F6B4F;background:rgba(31,107,79,.12);box-shadow:0 0 0 1px #1F6B4F}
.fs-opt.is-on b{color:#1F6B4F}
.fs-opt.is-on b::before{border-color:#1F6B4F;background:#1F6B4F;box-shadow:inset 0 0 0 2px #fff}
.fs-opt:hover{border-color:#1F6B4F}
/* 当日班次即时确认倒计时 */
.urgent-cd{animation:cdBlink 1.6s ease-in-out infinite}
@keyframes cdBlink{0%,100%{opacity:1}50%{opacity:.5}}
/* 地图图例/bar 微光 */
.veh-mk{box-shadow:0 3px 12px rgba(0,0,0,.55),0 0 0 1px rgba(255,255,255,.25)}
</style>
</head>
<body>
<div class="shell" id="shell">
  <header class="switcher">
    <div class="switcher__brand">
      <div class="switcher__logo" id="swLogo"></div>
      <div>
        <div class="switcher__title">无人车卸货履约平台</div>
        <div class="switcher__sub">B端配送 · 人车接力 · 确定性卸货</div>
      </div>
    </div>
    <nav class="switcher__tabs" id="verTabs">
      <button class="switcher__tab is-active" data-v="a"><span class="sw-dot"></span>A · 调度舱</button>
      <button class="switcher__tab" data-v="b"><span class="sw-dot"></span>B · 企业工作台</button>
      <button class="switcher__tab" data-v="c"><span class="sw-dot"></span>C · 履约现场</button>
      <button class="switcher__tab" data-v="m"><span class="sw-dot"></span>M · 运营管理</button>
    </nav>
    <div class="switcher__hint" id="verHint">平台调度运营视角 · 深色控制台，全链路监控确认状态</div>
    <button class="switcher__exit" id="btnExit">切换角色 <span class="v-badge" id="vBadge"></span></button>
  </header>

  <main class="ver ver-a is-active" id="verA" data-ver="a"></main>
  <main class="ver ver-b" id="verB" data-ver="b"></main>
  <main class="ver ver-c" id="verC" data-ver="c"></main>
  <main class="ver ver-m" id="verM" data-ver="m"></main>
</div>

<!-- 登录 / 角色选择 -->
<div class="login" id="loginScreen">
  <div class="login__card">
    <div class="login__logo" id="lgLogo"></div>
    <div class="login__brand">
      <h1>无人车卸货履约平台</h1>

    <div class="login__desc">无人车到站后由绑定责任人完成卸货签收，覆盖派单、确认、结算全链路。选择身份进入对应工作台：</div>
    <div class="login__roles">
      <button class="login__role" data-role="a">
        <span class="lr-ic lr-a"></span>
        <span class="lr-name">调度运营台</span>
        <span class="lr-desc">平台运营视角 · 监控停靠点确认状态、异常外溢与车辆到站时序</span>
        <span class="lr-tags"><i>到站时序</i><i>主责锁定</i><i>外溢广播</i><i>SLA 赔付</i></span>
      </button>
      <button class="login__role" data-role="b">
        <span class="lr-ic lr-b"></span>
        <span class="lr-name">货主企业台</span>
        <span class="lr-desc">货主视角 · 配送任务、责任人确认、卸货结算与账单一屏管理</span>
        <span class="lr-tags"><i>新建任务</i><i>责任人管理</i><i>费用结算</i><i>确认规则</i></span>
      </button>

    if(d.STAFF){ STAFF.length=0; STAFF.push.apply(STAFF, d.STAFF); }
    if(d.MINE){ MINE.length=0; MINE.push.apply(MINE, d.MINE); }
    if(d.progress) Object.assign(progress, d.progress);
    if(d.state) Object.assign(state, d.state);
    if(typeof d.seq==='number') seq=d.seq;
    return true;
  }catch(e){ return false; }
}

function toast(msg){
  const t = $('#toast');
  t.textContent = msg;
  t.classList.add('show');
  clearTimeout(t._timer);
  t._timer = setTimeout(()=>t.classList.remove('show'), 2600);
}
function esc(s){ return String(s).replace(/[&<>"]/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c])); }
/* ---------- 当日班次即时确认流程 ---------- */
function urgentCdText(s){
  if(!s||!s.urgentDeadline||s.status==='broadcast') return '';
  const left=Math.max(0,Math.floor((s.urgentDeadline-Date.now())/1000));
  return String(Math.floor(left/60)).padStart(2,'0')+':'+String(left%60).padStart(2,'0');
}
let urgentRerenderPending=false;
function checkUrgentFlow(){
  let changed=false;
  allStops().forEach(s=>{
    if(s.shift!=='today'||!s.urgentDeadline||s.status==='broadcast') return;
    if(Date.now()>s.urgentDeadline){
      if(s.status==='escalated'){
        s.backup=[{name:'片区备选',role:'备选',confirmed:false,score:4.2}];
        s.status='partial';
        s.urgentDeadline=Date.now()+URGENT_CONFIRM_MIN*60000;
        addLog(s,'主责超时未确认，自动升级备选（限时 '+URGENT_CONFIRM_MIN+' 分钟）');
        changed=true;
      } else if(s.status==='partial'){
        s.status='broadcast'; s.main=null; s.backup=[]; s.urgentDeadline=null;
        addLog(s,'备选超时未响应，自动外溢零工池广播');
        changed=true;
      }
    }
  });
  if(changed&&!urgentRerenderPending){ urgentRerenderPending=true; setTimeout(()=>{ urgentRerenderPending=false; if(state.role) renderCurrent(); },60); }
}
setInterval(()=>{
  checkUrgentFlow();
  document.querySelectorAll('.urgent-cd').forEach(el=>{ const s=stopById(el.dataset.sid); if(s&&s.shift==='today') el.textContent=urgentCdText(s); });
},1000);
function statusPill(s){
  const m = STATUS[s];

}

function countdownToDeadline(){
  const now=new Date();
  const dl=new Date(); dl.setHours(22,0,0,0);
  if(dl<=now) dl.setDate(dl.getDate()+1);
  let s=Math.floor((dl-now)/1000);
  const h=String(Math.floor(s/3600)).padStart(2,'0');
  const m=String(Math.floor(s%3600/60)).padStart(2,'0');
  return h+':'+m;
}

/* 到场定位校验：责任人确认到场（开始卸货）前，必须位于站点附近（默认 200 米内） */
const ARRIVE_RADIUS_M=200;
/* 责任人确认接单：把确认写回站点绑定状态，A/B 版同步可见 */
function confirmWorkerFor(s, w){
  w = w || WORKER;
  if(s.main && s.main.name===w.name){ s.main.confirmed=true; }
  else if(s.backup.some(b=>b.name===w.name)){ s.backup.find(b=>b.name===w.name).confirmed=true; }
  else {
    /* 新责任人到场：顶替为主责，原主责降级为备选，保证 A/B 版状态一致且不污染数据 */
    if(s.main) s.backup.unshift(s.main);
    s.main={name:w.name, role:w.role||'责任人', confirmed:true, score:w.score||4.5, phone:w.phone||'--'};
  }
  if(s.main && s.main.confirmed){
    if(s.shift==='today'){ s.status='ready'; s.urgentDeadline=null; }
    else { s.status = s.backup.some(b=>b.confirmed) ? 'ready' : 'partial'; }
  }
  else if(s.backup.some(b=>b.confirmed)){ if(s.shift==='today'){ s.status='ready'; s.urgentDeadline=null; } else { s.status='partial'; } }
  else { s.status='escalated'; }
}

function cGrab(stopId, urgent){
  const s=stopById(stopId);

  if(!progress[stopId]) progress[stopId]='pending';
  confirmWorkerFor(s, WORKER);
  addLog(s, urgent?('责任人接当日班次确认单，绑定'+WORKER.name):('责任人从零工池抢单，绑定'+WORKER.name));
  toast((urgent?'接单确认成功':'抢单成功')+'：「'+s.name+'」已加入今日任务，预估收入 ¥'+cIncome(stopId).toFixed(2));

function havM(lat1,lng1,lat2,lng2){
  const R=6371000, rad=d=>d*Math.PI/180;
  const dLat=rad(lat2-lat1), dLng=rad(lng2-lng1);
  const a=Math.sin(dLat/2)*Math.sin(dLat/2)+Math.cos(rad(lat1))*Math.cos(rad(lat2))*Math.sin(dLng/2)*Math.sin(dLng/2);
  return Math.round(R*2*Math.atan2(Math.sqrt(a),Math.sqrt(1-a)));
}
function getMyPosition(cb){
  if(!navigator.geolocation){ cb({ok:false,code:'unsupported'}); return; }
  navigator.geolocation.getCurrentPosition(
    p=>cb({ok:true,lat:p.coords.latitude,lng:p.coords.longitude}),
    e=>cb({ok:false,code:e.code}),
    {enableHighAccuracy:true,timeout:8000,maximumAge:5000});
}

const MLINE_COLORS = {R1:'#2DD4BF', R2:'#4F8BFF', R3:'#A78BFA'};

const DEMO_ROUTES  = JSON.parse(JSON.stringify(ROUTES));
const DEMO_VEHICLES= JSON.parse(JSON.stringify(VEHICLES));

/* ============ 底图配置：默认高德公开栅格瓦片（视觉=高德地图、无需Key、无WebGL依赖、国内加载快）
   可选 OSM / Carto 切换；任一源加载失败自动切换下一个 ============ */
const TILE_SOURCES=[
  {name:'高德地图', url:'https://wprd0{s}.is.autonavi.com/appmaptile?lang=zh_cn&size=1&scl=1&style=8&x={x}&y={y}&z={z}', subs:['1','2','3','4'], maxZoom:17},
  {name:'高德·备用域', url:'https://webst0{s}.is.autonavi.com/appmaptile?style=8&x={x}&y={y}&z={z}', subs:['1','2','3','4'], maxZoom:17},
  {name:'OSM', url:'https://tile.openstreetmap.org/{z}/{x}/{y}.png', maxZoom:19},
  {name:'Carto浅色', url:'https://{s}.basemaps.cartocdn.com/light_all/{z}/{x}/{y}{r}.png', subs:['a','b','c','d'], maxZoom:19}
];
function loadTilePref(){ try{ const v=parseInt(localStorage.getItem('unload_tile_src')||'0',10); return (v>=0&&v<TILE_SOURCES.length)?v:0; }catch(e){ return 0; } }
function saveTilePref(i){ try{ localStorage.setItem('unload_tile_src', String(i)); }catch(e){} }
function mapSrc(){ return TILE_SOURCES[loadTilePref()].name; }
let tileSrcIdx=loadTilePref(), tileErrCount=0;
/* 探测底图源是否可用（拉取贵阳区域 z10 单张瓦片，5s 超时） */
function probeTile(src, cb){
  try{
    const img=new Image();
    let url=src.url.replace('{s}',(src.subs||['a'])[0]);
    url=url.replace('{z}','10').replace('{x}','815').replace('{y}','433').replace('{r}','');
    const t=setTimeout(()=>{ img.onload=img.onerror=null; cb(false); },5000);
    img.onload=()=>{ clearTimeout(t); cb(true); };
    img.onerror=()=>{ clearTimeout(t); cb(false); };
    img.src=url;
  }catch(e){ cb(false); }
}
/* 从偏好源开始探测，自动选用第一个可用的源 */
function pickSource(cb){
  let cur=tileSrcIdx, tried=0;
  const next=()=>{
    if(tried>=TILE_SOURCES.length){ cb(TILE_SOURCES[cur]); return; }
    const src=TILE_SOURCES[cur]; tried++;
    probeTile(src, ok=>{
      if(ok){ tileSrcIdx=cur; tileErrCount=0; saveTilePref(tileSrcIdx); cb(src); }
      else{ cur=(cur+1)%TILE_SOURCES.length; next(); }
    });
  };
  next();
}
function addTileLayer(map){
  pickSource(src=>{
    const opts={maxZoom:src.maxZoom, attribution:'© '+src.name};
    if(src.subs) opts.subdomains=src.subs;
    const tl=L.tileLayer(src.url, opts).addTo(map);
    tl.on('tileerror',()=>{
      tileErrCount++;
      if(tileErrCount>=8 && tileSrcIdx<TILE_SOURCES.length-1){
        tileSrcIdx++; tileErrCount=0; saveTilePref(tileSrcIdx);
        try{ map.removeLayer(tl); }catch(e){}
        addTileLayer(map);
      }
    });
  });
}
/* Leaflet 库多源加载（jsdelivr 偶发不可达时换源） */
const LEAF_CDNS=[
  'https://cdn.jsdelivr.net/npm/leaflet@1.9.4/dist/leaflet.js',
  'https://unpkg.com/leaflet@1.9.4/dist/leaflet.js',
  'https://cdn.bootcdn.net/ajax/libs/leaflet/1.9.4/leaflet.min.js'
];
function loadLeaflet(cb){
  if(typeof L!=='undefined'){ cb&&cb(); return; }
  let i=0;
  const tryNext=()=>{
    if(i>=LEAF_CDNS.length){ cb&&cb(); return; }
    const s=document.createElement('script');
    s.src=LEAF_CDNS[i++];
    s.onload=()=>{ if(typeof L!=='undefined'){ cb&&cb(); } else tryNext(); };
    s.onerror=tryNext;
    document.head.appendChild(s);
  };
  tryNext();
}
/* 车辆沿线路移动动画（状态点随站点履约进度联动） */
let vehTicker=null, vehAnimMarkers={}, vehAnimStep={}, vehStopMarkers={};
function stopDotColor(pg){ return PROGRESS_DOT[pg] || '#6C7E8C'; }
function vehMarkerHtml(v, color, pg){ return '<div class="veh-mk" style="background:'+color+'">'+v+'<i class="veh-st" style="background:'+stopDotColor(pg)+'"></i></div>'; }
/* ---------- 时刻表推演：车辆按线路 ETA 静态推算位置（替代自动动画，可手动拖时刻） ---------- */
function etaMin(str){ const m=String(str||'').match(/^(\d{1,2}):(\d{2})/); return m?(+m[1])*60+(+m[2]):0; }
function fmtMin(t){ t=Math.round(t); return String(Math.floor(t/60)).padStart(2,'0')+':'+String(t%60).padStart(2,'0'); }
function nowMin(){ const d=new Date(); return d.getHours()*60+d.getMinutes(); }
function mapTimeMin(){ const raw=state.mapTime; return (raw==null||raw==='live')?Math.max(0,Math.min(1439,nowMin())):raw; }
function vehPosByTime(r, tMin){
  const pts=[coordOf({id:'仓',name:r.depart})].concat(r.stops.map(s=>coordOf(s)));
  const etas=r.stops.map(s=>etaMin(s.eta));
  const n=r.stops.length;
  if(!n) return {pos:pts[0],label:'未配置站点',idx:0};
  const dep=Math.max(0,etas[0]-30);
  if(tMin<=dep) return {pos:pts[0],label:'在仓待发 · '+r.depart,idx:0};
  for(let i=0;i<n;i++){
    if(tMin<=etas[i]){
      const a=pts[i],b=pts[i+1],t0=i===0?dep:etas[i-1],t1=etas[i];
      const f=Math.max(0,Math.min(1,(tMin-t0)/((t1-t0)||1)));
      return {pos:[a[0]+(b[0]-a[0])*f,a[1]+(b[1]-a[1])*f],label:'前往 '+r.stops[i].name+' · 预计 '+r.stops[i].eta+' 到站',idx:i+1};
    }
  }
  return {pos:pts[n],label:'已收班 · 末站 '+r.stops[n-1].name,idx:n};
}
function drawVehBySchedule(){
  if(!mMap||!mMapLayer) return;
  const tMin=mapTimeMin();
  ROUTES.forEach((r,ri)=>{
    const pts=[coordOf({id:'仓',name:r.depart})].concat(r.stops.map(s=>coordOf(s)));
    const v=VEHICLES[r.id]; if(!v||pts.length<2) return;
    if(vehAnimMarkers[ri]){ try{ mMapLayer.removeLayer(vehAnimMarkers[ri]); }catch(e){} }
    const pp=vehPosByTime(r,tMin);
    const pgIdx=pp.idx-1;
    const pg=pgIdx>=0&&r.stops[pgIdx]?progress[r.stops[pgIdx].id]:'pending';
    const icon=L.divIcon({className:'veh-ic',html:vehMarkerHtml(v.id,MLINE_COLORS[r.id],pg),iconSize:[30,30],iconAnchor:[15,15]});
    vehAnimMarkers[ri]=L.marker(pp.pos,{icon}).addTo(mMapLayer)
      .bindPopup('<div class="mp-card"><div class="mp-title">'+ICONS.truck+' '+esc(v.id)+' · '+esc(v.plate)+'</div>'
        +'<div class="mp-line">'+esc(r.name)+' · 按时刻表推算位置</div>'

        +'<div class="mp-row"><span>演示时刻</span><b>'+fmtMin(tMin)+'</b></div>'
        +'<div class="mp-row"><span>实时定位</span><b class="t-muted">需车辆 GPS/IoT 数据接入</b></div></div>');
  });
}
function drawRouteArrows(pts,color){

  stopVehicleAnim();
  const seqs=ROUTES.map(r=>[coordOf({id:'仓',name:r.depart})].concat(r.stops.map(s=>coordOf(s))));
  if(!seqs.some(s=>s.length>1)) return;
  const tick=()=>{
    ROUTES.forEach((r,ri)=>{
      const seq=seqs[ri]; if(!seq||seq.length<2) return;
      if(!vehAnimMarkers[ri]) return;
      vehAnimStep[ri]=((vehAnimStep[ri]||0)+1)%seq.length;
      const c=seq[vehAnimStep[ri]];
      try{ vehAnimMarkers[ri].setLatLng([c[0],c[1]]); }catch(e){}
      /* 车辆状态点：反映当前所在站点的履约进度 */
      const cur=r.stops[vehAnimStep[ri]-1];
      const pg=cur?progress[cur.id]:'pending';
      try{
        vehAnimMarkers[ri].setIcon(L.divIcon({className:'veh-ic', html:vehMarkerHtml((VEHICLES[r.id]||{id:'--'}).id, MLINE_COLORS[r.id], pg), iconSize:[36,20], iconAnchor:[18,10]}));
      }catch(e){}
      /* 站点标记颜色同步履约进度 */
      if(vehStopMarkers[ri]) vehStopMarkers[ri].forEach((mk,i)=>{
        const s=r.stops[i]; if(s) mk.setStyle({fillColor: stopDotColor(progress[s.id])});
      });
    });
  };
  vehTicker=setInterval(tick, 1600);
}

/* ============ 定位服务 ============
   使用浏览器原生 Geolocation API 获取坐标，不接入任何第三方地图密钥，
   避免前端暴露 Key / Secret（高德逆地理需后端代理，生产环境请勿在客户端硬编码密钥）。 */
function locateMe(){
  if(!mMap){ toast('地图未就绪，请稍候'); return; }
  if(!navigator.geolocation){ toast('当前浏览器不支持定位'); return; }
  toast('正在获取位置…');
  navigator.geolocation.getCurrentPosition((pos)=>{
    const lat=pos.coords.latitude, lng=pos.coords.longitude;
    if(window._myLoc){ try{ mMap.removeLayer(window._myLoc); }catch(e){} }
    window._myLoc=L.circleMarker([lat,lng],{radius:10,color:'#fff',weight:3,fillColor:'#3B82F6',fillOpacity:.95}).addTo(mMap);
    mMap.flyTo([lat,lng],15,{duration:.8});
    window._myLoc.bindPopup('<b>📍 我的位置</b><br><span class="t-muted">'+lat.toFixed(5)+', '+lng.toFixed(5)+'</span>').openPopup();
    toast('我的位置：'+lat.toFixed(5)+', '+lng.toFixed(5)+'（逆地理地址需后端代理获取）');
  },(err)=>{
    toast('定位失败：'+(err.code===1?'已拒绝定位授权（请在浏览器设置中允许）':err.code===2?'无法获取位置信号':err.code===3?'定位超时':'未知错误'));
  },{enableHighAccuracy:true, timeout:8000, maximumAge:5000});
}

/* 月度成本模型：车辆折旧(5年) / 电费 / 保险 / 维护 */
function vehCostBase(model){
  const m=model||'新石器 X3';
  const t={'新石器 X3':{price:200000,insu:900,maint:500},'九识 Z5':{price:150000,insu:850,maint:450}}[m]||{price:180000,insu:880,maint:480};
  return {price:t.price, insu:t.insu, maint:t.maint};
}
function vehMonthlyCost(model, km){
  const b=vehCostBase(model);
  const depre=Math.round(b.price/60);
  const elec=Math.round(km*0.15*0.6*30);
  return {depre:depre, elec:elec, insu:b.insu, maint:b.maint, total:depre+elec+b.insu+b.maint};
}
function lineKm(r){ return 16+r.stops.length*11; }
function mReportHtml(){
  const all=allStops();
  const totalItems=all.reduce((n,s)=>n+s.items,0);
  const totalFee=all.reduce((n,s)=>n+unloadFee(s),0);
  const days=22;
  const monthOrders=totalItems*1.2*days;
  const monthFee=totalFee*days;
  const monthCut=monthFee*CUT;
  const monthLabor=monthFee*0.85;
  const vehTotal=ROUTES.reduce((n,r)=>{ const v=VEHICLES[r.id]; return n+(v?vehMonthlyCost(v.model, lineKm(r)).total:0); },0);
  const monthProfit=monthCut-vehTotal;
  /* 线路对比 */
  const lines=ROUTES.map(r=>{
    const items=r.stops.reduce((n,s)=>n+s.items,0);
    const fee=r.stops.reduce((n,s)=>n+unloadFee(s),0);
    const orders=Math.round(r.stops.length*18*days);
    const labor=fee*days*0.9;
    const save=orders*6.5;
    const vc=VEHICLES[r.id]?vehMonthlyCost(VEHICLES[r.id].model, lineKm(r)):{total:0,depre:0,elec:0,insu:0,maint:0};
    const rev=fee*days;
    const profit=rev*0.15-vc.total;
    return {r,items,fee,orders,labor,save,vc,rev,profit};
  });
  const maxFee=Math.max.apply(null,lines.map(l=>l.fee),1);
  const maxOrders=Math.max.apply(null,lines.map(l=>l.orders),1);
  const maxRev=Math.max.apply(null,lines.map(l=>l.rev),1);
  /* 单车成本拆解（按车型） */
  const models=[];
  lines.forEach(l=>{ if(VEHICLES[l.r.id] && !models.find(x=>x===VEHICLES[l.r.id].model)) models.push(VEHICLES[l.r.id].model); });
  const costHtml=models.map(md=>{
    const km=Math.round(lines.reduce((n,l)=>n+(VEHICLES[l.r.id]&&VEHICLES[l.r.id].model===md?lineKm(l.r):0),0));
    const vc=vehMonthlyCost(md, km);
    const max=Math.max(vc.depre,vc.elec,vc.insu,vc.maint,1);
    const item=(k,v,label)=>{ return '<div class="rp-bar"><span class="rp-bk">'+label+'</span><div class="rp-bt"><i style="width:'+(v/max*100)+'%"></i></div><b>¥'+v.toLocaleString()+'</b></div>'; };
    return '<div class="rp-line"><div class="rp-lh"><b>'+esc(md)+'</b><span class="t-muted">月合计 ¥'+vc.total.toLocaleString()+' / 车</span></div>'
      +'<div class="rp-bars">'
      +item('d',vc.depre,'折旧 /5年')
      +item('e',vc.elec,'电费')
      +item('i',vc.insu,'保险')
      +item('m',vc.maint,'维护')
      +'</div></div>';
  }).join('');
  /* 线路盈亏 */
  const pnlRows=lines.map(l=>{
    const bar=v=>Math.max(2,Math.round(v/maxRev*100));
    return '<div class="rp-line"><div class="rp-lh"><span class="rp-rdot" style="background:'+MLINE_COLORS[l.r.id]+'"></span><b>'+esc(l.r.name)+'</b><span class="t-muted">'+l.r.stops.length+' 站 · 月 '+l.orders.toLocaleString()+' 单</span></div>'
      +'<div class="rp-bars">'
      +'<div class="rp-bar"><span class="rp-bk">月营收</span><div class="rp-bt"><i style="width:'+bar(l.rev)+'%"></i></div><b>¥'+l.rev.toLocaleString()+'</b></div>'
      +'<div class="rp-bar"><span class="rp-bk">卸货人工</span><div class="rp-bt"><i style="width:'+bar(l.rev*0.85)+'%"></i></div><b>-¥'+Math.round(l.rev*0.85).toLocaleString()+'</b></div>'
      +'<div class="rp-bar"><span class="rp-bk">车辆成本</span><div class="rp-bt"><i style="width:'+bar(l.vc.total)+'%"></i></div><b>-¥'+l.vc.total.toLocaleString()+'</b></div>'
      +'<div class="rp-bar"><span class="rp-bk">平台毛利</span><div class="rp-bt good"><i style="width:'+bar(Math.max(0,l.profit))+'%"></i></div><b class="'+(l.profit>=0?'':'')+'">¥'+l.profit.toLocaleString()+'</b></div>'
      +'</div></div>';
  }).join('');
  /* 近7日单量 */
  const days7=[['08-20',132],['08-21',158],['08-22',141],['08-23',176],['08-24',154],['08-25',168],['08-26',149]];
  const maxDay=Math.max.apply(null,days7.map(d=>d[1]));
  /* 站点排行 */
  const top=all.slice().sort((a,b)=>b.items-a.items).slice(0,5);
  const maxItems=Math.max.apply(null,top.map(s=>s.items),1);
  /* 责任人排行 */
  const topS=STAFF.slice().sort((a,b)=>b.score-a.score).slice(0,5);
  const maxScore=5;

  const lineRows=lines.map(l=>{
    return '<div class="rp-line"><div class="rp-lh"><span class="rp-rdot" style="background:'+MLINE_COLORS[l.r.id]+'"></span><b>'+esc(l.r.name)+'</b><span class="t-muted">'+l.r.stops.length+' 站 · 月 '+l.orders.toLocaleString()+' 单</span></div>'

  }).join('');

  const dayHtml=days7.map(d=>{

    return '<div class="rp-day"><div class="rp-dv">'+d[1]+'</div><div class="rp-dcol"><i style="height:'+h+'%"></i></div><span>'+d[0].slice(3)+'</span></div>';
  }).join('');

  const topHtml=top.map(s=>{
    return '<div class="rp-row"><span class="rp-rn">'+esc(s.name)+'</span><div class="rp-rt"><i style="width:'+(s.items/maxItems*100)+'%"></i></div><b>'+s.items+' 件</b></div>';
  }).join('');
  const staffHtml=topS.map(p=>{
    return '<div class="rp-row"><span class="rp-rn">'+esc(p.name)+'</span><div class="rp-rt good"><i style="width:'+(p.score/maxScore*100)+'%"></i></div><b>'+p.score.toFixed(1)+'</b></div>';

function bindM(){
  $('#verM').querySelectorAll('[data-mact]').forEach(b=>b.addEventListener('click',()=>{
    const act=b.dataset.mact, id=b.dataset.id, rid=b.dataset.rid, sid=b.dataset.sid;
    if(act==='addVehicle') openVehicleForm();
    else if(act==='editVehicle') openVehicleForm(id);
    else if(act==='delVehicle') confirmDel('vehicle', id);
    else if(act==='addRoute') openRouteForm();
    else if(act==='editRoute') openRouteForm(id);
    else if(act==='addStop') openStopForm(id);
    else if(act==='editStop') openStopForm(rid, sid);
    else if(act==='delStop') confirmDel('stop', rid+'|'+sid);
    else if(act==='addStaff') openStaffForm();
    else if(act==='editStaff') openStaffForm(id);
    else if(act==='delStaff') confirmDel('staff', id);
    else if(act==='inviteStaff') openInviteModal();
    else if(act==='staffFilter'){ state.mStaffFilter=b.dataset.f; renderM(); }
    else if(act==='approveInvite') approveInvite(id);
    else if(act==='rejectInvite') rejectInvite(id);
    else if(act==='mapCfg') openMapCfg();
    else if(act==='locate') locateMe();
  }));
  if(state.mNav==='map') initMap();
}

function saveVehicle(rk){
  const plate=$('#mfPlate').value.trim();
  if(!plate){ toast('请输入车牌号'); return; }
  const route=$('#mfRoute').value;
  let id;
  if(rk && VEHICLES[rk]) id=VEHICLES[rk].id;
  else if(VEHICLES[route]) id=VEHICLES[route].id;
  else {
    let max=0; Object.values(VEHICLES).forEach(v=>{ const n=parseInt(String(v.id||'').replace(/\D/g,''),10); if(n>max) max=n; });
    id='V'+String(max+1).padStart(2,'0');
  }
  const rec={id:id, plate:plate, model:$('#mfModel').value.trim()||'新石器 X3', route:route, battery:+$('#mfBatt').value||80, loadRate:0.6+Math.random()*0.35, status:$('#mfStatus').value, driver:'无人·远程接管'};
  if(rk && rk!==route && VEHICLES[rk]) delete VEHICLES[rk];
  const old=VEHICLES[route];
  VEHICLES[route]=rec;
  closeModal(); renderM();
  toast(old?(old.id===id?'车辆 '+id+' 已更新':'线路 '+route+' 已换为车辆 '+rec.id):'已新增车辆 '+rec.id+' · 线路 '+route);

function doDel(kind,key){

}

/* ---------- 开源地图 Leaflet（高德不可用/未配置时的兜底 · 多源瓦片自动切换） ---------- */
function initLeaflet(){
  const box=$('#mLeaflet'); if(!box) return;
  const doInit=()=>{
    if(typeof L==='undefined'){ box.innerHTML='<div class="vm-map-fail">地图组件加载失败：请检查网络后刷新重试。其余功能不受影响。</div>'; return; }
    stopVehicleAnim(); vehAnimMarkers={}; vehAnimStep={}; vehStopMarkers={};
    if(mMap && mMap.getContainer()===box && mMap._src==='osm'){
      mMap.invalidateSize();
      if(mMapLayer) mMapLayer.clearLayers();
      else mMapLayer=L.layerGroup().addTo(mMap);
    } else {
      if(mMap){ try{ mMap.remove(); }catch(e){} }
      mMap=null; mMapLayer=null;
      box.innerHTML=''; /* 清掉加载占位，避免遮住地图 */
      mMap=L.map('mLeaflet', {zoomControl:true}).setView([26.60,106.66],12);
      mMap._src='osm';
      addTileLayer(mMap); /* 高德栅格 → OSM → Carto 自动切换 */
      mMapLayer=L.layerGroup().addTo(mMap);
      if(mPick){ mMap.on('click', e=>{ mPick(e.latlng.lat, e.latlng.lng); }); }
    }
    ROUTES.forEach((r,ri)=>{
      const pts=[coordOf({id:'仓', name:r.depart})].concat(r.stops.map(s=>coordOf(s)));
      L.polyline(pts,{color:MLINE_COLORS[r.id], weight:3, opacity:.75}).addTo(mMapLayer);
      drawRouteArrows(pts, MLINE_COLORS[r.id]);
      const dc=coordOf({id:'仓', name:r.depart});
      L.circleMarker(dc,{radius:5,color:'#fff',weight:2,fillColor:'#8CA3C3',fillOpacity:1}).bindPopup('<b>'+esc(r.depart)+'</b><br>'+esc(r.name)).addTo(mMapLayer);
      r.stops.forEach((s,si)=>{
        const c=coordOf(s);
        const mk=L.circleMarker(c,{radius:7,color:'#0B1220',weight:1.5,fillColor:MLINE_COLORS[r.id],fillOpacity:.95})
          .bindPopup('<div class="mp-card"><div class="mp-title">'+esc(s.name)+'</div>'
            +'<div class="mp-line">'+ICONS.route+' '+esc(r.name)+' · '+esc(s.area)+'</div>'
            +'<div class="mp-grid">'
            +'<div><span>到站</span><b>'+s.eta+'</b></div>'
            +'<div><span>件数/重量</span><b>'+s.items+'件 · '+s.weightKg+'kg</b></div>'
            +'<div><span>货物标识</span><b>'+s.slots.join(' ')+'</b></div>'
            +'<div><span>卸货时长</span><b>'+s.estMin+' min</b></div>'
            +'</div>'
            +'<div class="mp-row"><span>履约进度</span><b style="color:'+PROGRESS_DOT[progress[s.id]]+'">'+PROGRESS_LABEL[progress[s.id]]+'</b></div>'
            +'<div class="mp-row"><span>确认状态</span><b>'+(s.status==='broadcast'?'外溢广播':esc(STATUS[s.status].label))+'</b></div>'
            +'<div class="mp-row"><span>卸货费</span><b>¥'+unloadFee(s).toFixed(2)+'</b></div>'
            +'<div class="mp-row"><span>主责</span><b>'+((s.main&&s.main.name)?esc(s.main.name):'未绑定')+'</b></div>'
            +'<div class="mp-row"><span>备选</span><b>'+((s.backup&&s.backup.length)?s.backup.map(b=>esc(b.name)).join('、'):'无')+'</b></div>'
            +(s.note?'<div class="mp-note">'+esc(s.note)+'</div>':'')
            +'</div>')
          .addTo(mMapLayer);
        if(progress[s.id]==='done'){ L.circleMarker(c,{radius:2.6,color:'#fff',weight:0,fillColor:'#fff',fillOpacity:1,interactive:false}).addTo(mMapLayer); }
        else if(progress[s.id]==='arrived'||progress[s.id]==='unloading'){ mk.setStyle({color:'#fff',weight:2.5}); }
        (vehStopMarkers[ri]=vehStopMarkers[ri]||[])[si]=mk;
      });
      /* 车辆实时位置（沿线路移动） */
      const veh=VEHICLES[r.id];
      if(veh){
        const icon=L.divIcon({className:'veh-ic', html:vehMarkerHtml(veh.id, MLINE_COLORS[r.id]), iconSize:[30,30], iconAnchor:[15,15]});
        vehAnimMarkers[ri]=L.marker(coordOf({id:'仓',name:r.depart}), {icon}).addTo(mMapLayer);
      }
    });
    drawVehBySchedule();
    const rg=$('#mapTimeRange');
    if(rg){ rg.addEventListener('input',()=>{ state.mapTime=+rg.value; const v=$('#mapTimeVal'); if(v) v.textContent=fmtMin(state.mapTime); drawVehBySchedule(); }); }
    const lv=$('#mapTimeLive');
    if(lv){ lv.addEventListener('click',()=>{ const n=Math.max(0,Math.min(1439,nowMin())); state.mapTime=n; const rg2=$('#mapTimeRange'),v2=$('#mapTimeVal'); if(rg2) rg2.value=n; if(v2) v2.textContent=fmtMin(n); drawVehBySchedule(); toast('已切换为当前时刻 '+fmtMin(n)+'，车辆按时刻表推算位置'); }); }
    setTimeout(()=>{ if(mMap) mMap.invalidateSize(); },80);
  };
  if(typeof L==='undefined') loadLeaflet(doInit); else doInit();
}

let pickModal=null, pickInstance=null;
/* 高德 POI 关键词搜索（JSONP）：搜站点/地点名 -> 候选列表。citylimit 限定贵阳市，避免外省同名误匹配。演示版前端直连，生产请走后端代理 */
function geocodeSearch(kw, cb){
  const key=(function(){ try{ return localStorage.getItem('unload_geo_key')||'8a6e3e74dceb54210912deb7081c2a7d'; }catch(e){ return '8a6e3e74dceb54210912deb7081c2a7d'; } })();
  const fn='__geoCB'+Date.now();
  const url='https://restapi.amap.com/v3/place/text?keywords='+encodeURIComponent(kw)+'&city='+encodeURIComponent('贵阳')+'&citylimit=true&key='+key+'&output=json&extensions=base&callback='+fn;
  const s=document.createElement('script');
  const done=(ok)=>{ try{ delete window[fn]; }catch(e){} try{ if(s.parentNode) s.parentNode.removeChild(s); }catch(e){} if(!ok&&cb) cb(null); };
  window[fn]=data=>{ done(true); cb(data||null); };
  s.onerror=()=>{ done(false); };
  s.src=url; document.head.appendChild(s);
}
function pickPinIcon(){
  if(typeof L==='undefined') return null;
  return L.divIcon({className:'pk-pin', html:'<svg width="30" height="42" viewBox="0 0 30 42"><path d="M15 1C7.3 1 1 7.3 1 15c0 10.2 14 26 14 26s14-15.8 14-26C29 7.3 22.7 1 15 1z" fill="#2DD4BF" stroke="#FFFFFF" stroke-width="2"/><circle cx="15" cy="15" r="5.5" fill="#0B1220"/></svg>', iconSize:[30,42], iconAnchor:[15,41]});
}
let pickPin=null, pickSel=null;
function clearPickPin(){
  if(pickPin){ try{ if(pickInstance) pickInstance.removeLayer(pickPin); }catch(e){} pickPin=null; }
  pickSel=null;
  const ok=document.getElementById('pkOk'), tip=document.getElementById('pkSelTip');
  if(ok){ ok.disabled=true; ok.classList.remove('primary'); }
  if(tip){ tip.style.display='none'; }
}
function closePick(){
  if(pickModal) pickModal.classList.remove('open');
  if(pickInstance){ try{ pickInstance.destroy(); }catch(e){} try{ pickInstance.remove(); }catch(e){} }

}
function openPickMap(onPick, cur, opts){
  opts=opts||{};
  if(!pickModal){
    pickModal=document.createElement('div'); pickModal.id='pickModal'; pickModal.className='vm-modal pick-modal';
    pickModal.innerHTML='<div class="vm-modal-box"><div class="vm-modal-head"><b>选择站点位置</b><button class="vm-modal-x">'+ICONS.logout.replace('width="15"','width="13"')+'</button></div>'
      +'<div class="vm-modal-body">'
      +'<div class="vm-pick-search"><input id="pkSearch" placeholder="输入站点 / 地址名称搜索定位，如：观山湖万达广场">'
      +'<button class="vm-btn" id="pkDo">'+ICONS.map+' 搜索</button></div>'
      +'<div class="vm-pick-results" id="pkResults"></div>'
      +'<div class="vm-pick-tip">'+ICONS.pin+' 拖动 / 缩放地图，在目标点位<button class="vm-btn ghost" id="pkLongHint" type="button">长按</button>约 0.6 秒落定标记；或从上方搜索结果中选择。</div>'
      +'<div class="vm-map vm-pick-map" id="pickMap"></div>'
      +'<div class="vm-pick-sel" id="pkSelTip">已选定：--</div>'

      +'</div></div>';

  }
  const sIn=$('#pkSearch'); if(sIn){ sIn.value=opts.kw||''; }
  clearPickPin();
  const res=$('#pkResults'); if(res) res.innerHTML='';
  pickModal.classList.add('open');
  setTimeout(()=>{
    const box=$('#pickMap'); if(!box) return;
    const init=()=>{
      if(typeof L==='undefined'){ box.innerHTML='<div class="vm-map-fail">地图组件加载失败：请检查网络后重试</div>'; return; }
      const p=L.map('pickMap',{zoomControl:true}).setView(cur?[cur[0],cur[1]]:[26.60,106.66],13);
      pickInstance=p;
      addTileLayer(p);
      if(cur){ pickPin=L.marker(cur,{icon:pickPinIcon()}).addTo(p); pickSel=cur; }
      const syncBtn=()=>{
        const ok=$('#pkOk'), tip=$('#pkSelTip');
        if(ok){ ok.disabled=!pickSel; if(pickSel) ok.classList.add('primary'); else ok.classList.remove('primary'); }
        if(tip){ if(pickSel){ tip.style.display='block'; tip.textContent='已选定：'+pickSel[0].toFixed(5)+', '+pickSel[1].toFixed(5); } else tip.style.display='none'; }
      };
      /* 长按选点：按住 0.6 秒落定位标记（拖动/缩放即取消计时） */
      let timer=null;
      const clearT=()=>{ if(timer){ clearTimeout(timer); timer=null; } };
      p.on('mousedown', e=>{ clearT(); timer=setTimeout(()=>{ timer=null; if(!pickPin) pickPin=L.marker([e.latlng.lat,e.latlng.lng],{icon:pickPinIcon()}).addTo(p); else pickPin.setLatLng([e.latlng.lat,e.latlng.lng]); pickSel=[e.latlng.lat,e.latlng.lng]; syncBtn(); toast('已锁定该位置，可确认或继续调整'); },600); });
      p.on('mousemove', clearT);
      p.on('mouseup', clearT);
      p.on('dragstart', clearT);
      p.on('zoomstart', clearT);
      p.on('touchstart', e=>{ clearT(); timer=setTimeout(()=>{ timer=null; const ll=p.mouseEventToLatLng(e.originalEvent); if(ll){ if(!pickPin) pickPin=L.marker([ll.lat,ll.lng],{icon:pickPinIcon()}).addTo(p); else pickPin.setLatLng([ll.lat,ll.lng]); pickSel=[ll.lat,ll.lng]; syncBtn(); toast('已锁定该位置，可确认或继续调整'); } },600); });
      p.on('touchmove', clearT);
      p.on('touchend', clearT);
      const ok=$('#pkOk');
      if(ok){ ok.disabled=!pickSel; if(pickSel) ok.classList.add('primary');
        ok.onclick=()=>{ if(pickSel){ closePick(); onPick(pickSel[0], pickSel[1]); toast('已选点：'+pickSel[0].toFixed(5)+', '+pickSel[1].toFixed(5)); } };
      }
      /* 搜索定位 */
      const doSearch=()=>{
        const kw=(sIn?$('#pkSearch').value:'').trim();
        if(!kw){ toast('请输入搜索关键词'); return; }
        const rbox=$('#pkResults'); if(rbox) rbox.innerHTML='<div class="pk-loading">正在搜索「'+esc(kw)+'」…</div>';
        geocodeSearch(kw, data=>{
          const rbox=$('#pkResults'); if(!rbox) return;
          const gs=(data&&data.pois)||[];
          const badKey=data&&(/USERKEY|INVALID_USER_KEY|PLAT/i.test(data.info||'')||data.status!=='1');
          if(badKey&&!gs.length){
            rbox.innerHTML='<div class="pk-keybox"><b>'+ICONS.gear+' 高德 Web 服务 Key：</b><input id="pkGeoKey" placeholder="粘贴 Web 服务 Key（32 位）"><button class="vm-btn" id="pkGeoKeySave">'+ICONS.check+' 保存并重试</button></div>';
            const gk=$('#pkGeoKey');
            if(gk&&localStorage.getItem('unload_geo_key')) gk.value=localStorage.getItem('unload_geo_key');
            const sv=$('#pkGeoKeySave');
            if(sv){ sv.onclick=()=>{ const v=(gk?gk.value:'').trim(); if(!v){ toast('请输入 Key'); return; } try{ localStorage.setItem('unload_geo_key', v); }catch(e){} toast('Key 已保存，重新搜索'); doSearch(); }; }
            return;
          }
          if(!gs.length){ rbox.innerHTML='<div class="pk-empty">未找到相关位置：请换关键词，或直接在地图上长按选点。'+(data&&data.info!=='OK'?'（高德返回：'+esc(data.info||data.status)+'）':'')+'</div>'; return; }
          rbox.innerHTML=gs.map((g,i)=>'<button type="button" class="pk-item" data-i="'+i+'"><b>'+esc(g.name)+'</b><span class="t-muted">'+esc((g.adname||g.pname||'')+(g.address?(' · '+g.address):''))+'<br>'+g.location+'</span></button>').join('');
          rbox.querySelectorAll('.pk-item').forEach(b=>b.addEventListener('click',()=>{
            const g=gs[+b.dataset.i];
            const ll=String(g.location||'').split(',').map(Number);
            if(ll.length===2&&isFinite(ll[0])&&isFinite(ll[1])){
              const lat=ll[1], lng=ll[0];
              if(!pickPin) pickPin=L.marker([lat,lng],{icon:pickPinIcon()}).addTo(p); else pickPin.setLatLng([lat,lng]);
              pickSel=[lat,lng]; syncBtn();
              p.flyTo([lat,lng],15,{duration:.7});
              toast('已定位：'+esc(g.name));
            }
          }));
        });
      };
      const pkDo=$('#pkDo'); if(pkDo){ pkDo.onclick=doSearch; }
      if(sIn){ sIn.onkeydown=e=>{ if(e.key==='Enter'){ e.preventDefault(); doSearch(); } }; if(opts.focus) setTimeout(()=>sIn.focus(),120); }
      syncBtn();
      setTimeout(()=>{ p.invalidateSize(); },80);
    };
    if(typeof L==='undefined') loadLeaflet(init); else init();
  },80);
}

  const skills=[].slice.call(document.querySelectorAll('#invForm input[name=skill]:checked')).map(i=>i.value);
  const apps=loadInviteApps();
  apps.unshift({id:'I'+Date.now().toString().slice(-6), name:name, phone:phone.replace(/(\d{3})\d{4}(\d{4})/,'$1****$2'), platform:$('#ivPlat').value, grid:$('#ivGrid').value.trim()||$('#ivPlat').value+'合作网点', region:$('#ivRegion').value, shift:shifts.join(' · '), skills:skills, pay:$('#ivPay').value, time:nowTag(), state:'待审核', _app:true});
  saveInviteApps(apps);
  INVITE_STAT.submit++;
  $('#invForm').style.display='none';
  $('#invOk').style.display='block';
  toast('登记已提交，等待运营审核');
}
/* ---------- 登录 / 角色进入 ---------- */
function enterRole(v){
  state.role=v;
  $('#loginScreen').style.display='none';
  $('#shell').style.display='flex';
  switchVer(v);
}
function goLogin(){
  state.role=null;
  $('#loginScreen').style.display='flex';
  $('#shell').style.display='none';
}

$('#swLogo').innerHTML='';
$('#lgLogo').innerHTML='';
$('#vBadge').textContent = APP_VERSION;
document.querySelectorAll('.lr-ic').forEach(el=>{
  const r=(el.className.match(/lr-([a-z])/)||[])[1]||'a';
  el.innerHTML={a:ICONS.radar,b:ICONS.store,c:ICONS.hand,m:ICONS.settings}[r]||ICONS.truck;
});
document.querySelectorAll('.switcher__tab').forEach(t=>{
  const v=t.dataset.v, ic={a:ICONS.radar,b:ICONS.store,c:ICONS.hand,m:ICONS.settings}[v]||ICONS.truck;
  const dot=t.querySelector('.sw-dot'); if(dot) dot.remove();
  const lbl=t.textContent.replace(/^\s*[A-Za-z]\s*·\s*/,'').trim();
  t.innerHTML='<span class="sw-ic">'+ic+'</span><span>'+lbl+'</span>';
});
document.querySelectorAll('.switcher__tab').forEach(t=>t.addEventListener('click',()=>switchVer(t.dataset.v)));
$('#btnInviteLogin').addEventListener('click',()=>{ showInviteScreen(); });
$('#invX').addEventListener('click',()=>{ $('#inviteScreen').style.display='none'; $('#loginScreen').style.display='flex'; });
$('#ivBack').addEventListener('click',()=>{ $('#inviteScreen').style.display='none'; $('#loginScreen').style.display='flex'; });
$('#invForm').addEventListener('submit',e=>{ e.preventDefault(); submitInvite(); });
(function(){
  const p=new URLSearchParams(location.search).get('invite');
  if(p){ INVITE_STAT.scan++; showInviteScreen(); toast('扫码成功：欢迎登记成为卸货员'); }
})();
document.querySelectorAll('.login__role').forEach(b=>b.addEventListener('click',()=>{
  const r=b.dataset.role;
  const roleName={a:'调度运营台',b:'货主企业台',c:'责任人履约台',m:'运营管理台'}[r]||'系统';
  enterRole(r);
  toast('欢迎进入「'+roleName+'」· 数据为示例演示');
}));
$('#btnDemo').addEventListener('click',()=>{
  enterRole('a'); state.role='demo';
  toast('演示模式 · 顶部可自由切换三版');
});
$('#btnExit').addEventListener('click',()=>{ goLogin(); toast('已退出 · 请选择身份进入'); });

const drawer=document.createElement('div');
drawer.className='vb-drawer';
drawer.id='drawer';
drawer.innerHTML='<div class="vd-head"></div><div class="vd-body"></div>';
document.body.appendChild(drawer);
drawer.addEventListener('click',e=>{ if(e.target===drawer) drawer.classList.remove('open'); });

/* 启动时尝试恢复本地持久化数据；支持 #a/#b/#c/#demo hash 直达对应角色 */
const restored=loadPersist();
const initHash=(location.hash||'').replace('#','');
if(initHash==='a'||initHash==='b'||initHash==='c'||initHash==='m'){ enterRole(initHash); }
else if(initHash==='demo'){ enterRole('a'); state.role='demo'; }
else if(restored && state.ver && ['a','b','c','m'].includes(state.ver)){ enterRole(state.ver); }
else { $('#loginScreen').style.display='flex'; $('#shell').style.display='none'; }
</script>
</body>
</html>
